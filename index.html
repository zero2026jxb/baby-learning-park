<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>宝贝学习乐园</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- 顶部欢迎栏 -->
<header class="topbar">
  <div class="logo">
    <span class="logo-star">⭐</span>
    <h1>宝贝学习乐园</h1>
  </div>
  <div class="top-actions">
    <div class="star-count" id="headerStarCount">⭐ 0</div>
    <button class="reset-btn" id="resetBtn" title="重置进度">🔄</button>
  </div>
</header>

<!-- 主容器 -->
<div class="main-container">
  <!-- 侧边栏导航 (PC) -->
  <nav class="sidebar" id="sidebar">
    <button class="nav-btn active" data-page="letters" data-color="pink">
      <span class="nav-icon">🔤</span>
      <span class="nav-label">字母乐园</span>
    </button>
    <button class="nav-btn" data-page="poems" data-color="green">
      <span class="nav-icon">📜</span>
      <span class="nav-label">古诗花园</span>
    </button>
    <button class="nav-btn" data-page="numbers" data-color="yellow">
      <span class="nav-icon">🔢</span>
      <span class="nav-label">数字王国</span>
    </button>
    <button class="nav-btn" data-page="logic" data-color="purple">
      <span class="nav-icon">🧩</span>
      <span class="nav-label">逻辑挑战</span>
    </button>
    <button class="nav-btn" data-page="adventure" data-color="blue">
      <span class="nav-icon">🏆</span>
      <span class="nav-label">闯关冒险</span>
    </button>
  </nav>

  <!-- 内容区 -->
  <main class="content" id="content">
    <!-- 各模块内容由JS渲染 -->
  </main>
</div>

<!-- 底部Tab导航 (移动端) -->
<nav class="bottom-nav" id="bottomNav">
  <button class="tab-btn active" data-page="letters">
    <span class="tab-icon">🔤</span>
    <span class="tab-label">字母</span>
  </button>
  <button class="tab-btn" data-page="poems">
    <span class="tab-icon">📜</span>
    <span class="tab-label">古诗</span>
  </button>
  <button class="tab-btn" data-page="numbers">
    <span class="tab-icon">🔢</span>
    <span class="tab-label">数字</span>
  </button>
  <button class="tab-btn" data-page="logic">
    <span class="tab-icon">🧩</span>
    <span class="tab-label">逻辑</span>
  </button>
  <button class="tab-btn" data-page="adventure">
    <span class="tab-icon">🏆</span>
    <span class="tab-label">闯关</span>
  </button>
</nav>

<script src="js/data.js"></script>
<script src="js/sound.js"></script>
<script src="js/app.js"></script>
</body>
</html>
