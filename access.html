<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宝贝学习乐园 - 访问入口</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
    background: linear-gradient(135deg, #fff0f6, #eef6ff, #fff9ec, #f0faf0, #f7f2ff);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: white;
    border-radius: 24px;
    padding: 40px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(0,0,0,0.12);
    max-width: 460px;
    width: 100%;
  }
  .emoji { font-size: 56px; animation: bounce 2s infinite; display:inline-block; }
  h1 {
    font-size: 28px;
    font-weight: 800;
    margin: 12px 0 6px;
    background: linear-gradient(135deg,#ff7eb3,#b28dff,#5aa9ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .sub { color:#888; font-size:14px; margin-bottom:24px; }
  #qrcode { margin: 0 auto 24px; }
  .url-box {
    background:#f8f4f0;
    border-radius:12px;
    padding:12px 16px;
    font-size:16px;
    font-weight:700;
    color:#4a4a4a;
    word-break: break-all;
    margin-bottom:12px;
    border:2px dashed #e0d6cc;
  }
  .tip { color:#999; font-size:13px; line-height:1.6; }
  .step { color:#666; font-size:14px; margin:6px 0; }
  .step b { color:#ff7eb3; }
  @keyframes bounce { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }
</style>
</head>
<body>
  <div class="card">
    <span class="emoji">🌈</span>
    <h1>宝贝学习乐园</h1>
    <div class="sub">扫码在手机上打开，陪宝贝一起学习！</div>
    <div id="qrcode"></div>
    <div class="url-box" id="urlDisplay">加载中...</div>
    <div class="step">📱 <b>手机步骤</b></div>
    <div class="step">1. 打开微信/相机，扫一扫上面的二维码</div>
    <div class="step">2. 无需同一个 WiFi，任何网络都能打开</div>
    <div class="step">3. 开始闯关冒险，收集星星 ⭐</div>
    <div class="tip">* 这是公网地址，发到任何地方都能访问</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script>
    // 使用当前页面地址生成二维码（自动使用实际访问域名/IP）
    var currentUrl = window.location.href;
    document.getElementById('urlDisplay').textContent = currentUrl;
    new QRCode(document.getElementById('qrcode'), {
      text: currentUrl,
      width: 200,
      height: 200,
      colorDark: "#4a4a4a",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.M
    });
  </script>
</body>
</html>
